name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tesseract with Urdu data
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-urd

      - name: Install
        run: pip install -e ".[db,app,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
